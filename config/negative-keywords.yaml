hard_exclude:
  - quantum computing
  - quantum information
  - quantum machine learning
  - quantum communication
  - quantum cryptography
  - quantum steganalysis
  - quantum protocol
  - quantum algorithms
  - quantum networks
  - medical diagnosis only
  - finance trading
  - blockchain
  - recommendation systems without graph or science relevance

soft_downweight:
  - quantum chemistry
  - pure benchmark leaderboard
  - generic LLM without science or graph relevance

context_exceptions:
  quantum chemistry:
    allow_if_any:
      - molecule
      - molecular
      - protein
      - rna
      - drug
      - material
