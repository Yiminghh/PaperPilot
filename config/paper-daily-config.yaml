project:
  name: paperpilot
  timezone: Europe/London

paths:
  project_root: .
  paperflow_root: ~/Obsidian/3-PaperFlow
  daily_notes_dir: ~/Obsidian/3-PaperFlow/Paper-Daily
  runs_dir: runs
  weekly_runs_dir: runs/weekly
  state_dir: state
  logs_dir: logs
  memory_dir: state/paper-memory
  seen_path: state/seen-papers.txt
  feedback_path: state/paper-feedback.jsonl
  hf_cache_dir: .cache/huggingface

arxiv:
  categories:
    - cs.AI
    - cs.LG
    - cs.CL
    - cs.CV
    - stat.ML
    - q-bio.BM
    - q-bio.MN
    - q-bio.QM
  days_window: 3
  max_results: 120
  category_delay_seconds: 8
  retries: 2
  timeout_seconds: 20

embedding:
  provider: local
  model: BAAI/bge-m3
  device: cpu
  batch_size: 8
  query_prefix: ""
  document_prefix: ""
  normalize_embeddings: true
  cache_dir: .cache/huggingface
  api_base_url: ""
  api_key_env: PAPERPILOT_EMBED_API_KEY
  api_model: ""
  api_timeout_seconds: 60

retrieval:
  bm25_top_k: 50
  embedding_top_k: 40
  embedding_min_score: 0.50
  final_top_k: 100
  rrf_k: 60
  matched_queries_per_paper: 6
  soft_downweight_multiplier: 0.75
  category_policy:
    cs.CL: only_keep_if_llm_or_foundation_model_relevant_to_science_or_graphs
    cs.CV: only_keep_if_geometric_3d_scientific_or_molecular_relevant
    q-bio: keep_if_ai4science_or_representation_learning_relevant
  category_policy_rules:
    only_keep_if_llm_or_foundation_model_relevant_to_science_or_graphs:
      - [large language model, llm, foundation model, agent, retrieval augmented, rag, transformer]
      - [science, scientific, graph, molecular, molecule, protein, rna, biomolecule, chemistry, biology, biomedical, clinical]
    only_keep_if_geometric_3d_scientific_or_molecular_relevant:
      - [3d, point cloud, mesh, geometric deep learning, molecular, molecule, protein, rna, biomolecule, chemistry, scientific, medical, clinical, microscopy, cryo, cell, biological, material, drug]
    keep_if_ai4science_or_representation_learning_relevant:
      - [machine learning, deep learning, neural, foundation model, language model, representation, prediction, predicting, predict, generative, diffusion, graph, transformer, embedding, qsar, clustering, classification, regression, classifier]
  priority_boost:
    topological_deep_learning: 1.5
    higher_order_graphs: 1.5
    molecular_or_rna_ai4science: 1.4
    foundation_models_for_science: 1.25
    generic_llm_without_science_or_graph: 0.6
    quantum_related: 0.0
    quantum_chemistry_with_molecular_ml: 0.7
  priority_boost_rules:
    topological_deep_learning:
      any: [topological, simplicial, cell complex, higher-order]
    higher_order_graphs:
      any: [higher-order graph, hypergraph, simplicial]
    molecular_or_rna_ai4science:
      any: [molecular, molecule, rna, biomolecule, protein]
    foundation_models_for_science:
      any: [foundation model]
    generic_llm_without_science_or_graph:
      any: [large language model, llm]
      none: [science, scientific, graph, molecular, rna]
    quantum_related:
      any: [quantum]
      none: [molecular, molecule, chemistry]
    quantum_chemistry_with_molecular_ml:
      any: [quantum chemistry]
